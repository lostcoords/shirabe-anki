name: Verify Anki runtime release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify release version
        run: |
          version=$(node -p 'require("./packages/template-runtime/package.json").version')
          test "$RELEASE_VERSION" = "$version"
      - run: npm run build --workspace @shirabe-org/anki-runtime
      - run: npm run test:runtime
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:runtime:browser
      - run: mkdir -p artifacts && npm run package:runtime
      - run: node script/verify-runtime-package.mjs artifacts/*.tgz
      - name: Record release provenance
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          const version = process.env.RELEASE_VERSION;
          const archive = `shirabe-org-anki-runtime-${version}.tgz`;
          const sha256 = createHash("sha256").update(readFileSync(`artifacts/${archive}`)).digest("hex");
          writeFileSync("artifacts/runtime-release.json", JSON.stringify({ version, sourceRevision: process.env.GITHUB_SHA, archive, sha256 }, null, 2) + "\n");
          JS
      - uses: actions/upload-artifact@v6
        with:
          name: anki-runtime-${{ inputs.version }}
          path: artifacts/*
          if-no-files-found: error
